          <h2 id="第四章"><a href="#第四章" class="headerlink" title="第四章"></a>第四章</h2><blockquote>
<p>函数泛型和类泛型</p>
</blockquote>
<figure class="highlight typescript"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment">// 函数泛型</span></span><br><span class="line"><span class="keyword">namespace</span> functionGeneric &#123;</span><br><span class="line">    <span class="comment">// function join(first:string|number,second:string|number)&#123;</span></span><br><span class="line">    <span class="comment">//     return `$&#123;first&#125;$&#123;second&#125;`</span></span><br><span class="line">    <span class="comment">// &#125;</span></span><br><span class="line">    <span class="comment">//如果我想保证两个参数同类型但不一定是什么类型，就要用泛型</span></span><br><span class="line">    <span class="function"><span class="keyword">function</span> <span class="title">join</span>&lt;<span class="title">T</span>&gt;(<span class="params">first: T, second: T</span>) </span>&#123;</span><br><span class="line">        <span class="keyword">return</span> <span class="string">`<span class="subst">$&#123;first&#125;</span><span class="subst">$&#123;second&#125;</span>`</span></span><br><span class="line">    &#125;</span><br><span class="line">    <span class="comment">//join&lt;number&gt;(1,&#x27;1&#x27;)//报错</span></span><br><span class="line">    <span class="comment">//join&lt;string&gt;(1,1)//报错</span></span><br><span class="line">    <span class="built_in">console</span>.log(join(<span class="number">1</span>, <span class="number">1</span>), join&lt;<span class="built_in">string</span>&gt;(<span class="string">&#x27;1&#x27;</span>, <span class="string">&#x27;1&#x27;</span>))<span class="comment">//这样是可以的，不写泛型也会自动推断</span></span><br><span class="line"></span><br><span class="line">    <span class="function"><span class="keyword">function</span> <span class="title">map</span>&lt;<span class="title">M</span>&gt;(<span class="params">params:M[],_:<span class="built_in">Array</span>&lt;M&gt;</span>)</span>&#123;<span class="comment">//指M数组,M[]和Array&lt;M&gt;差不多</span></span><br><span class="line">        <span class="keyword">return</span> params.concat(_)</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="built_in">console</span>.log(map&lt;<span class="built_in">string</span>&gt;([<span class="string">&#x27;123&#x27;</span>],[<span class="string">&#x27;0&#x27;</span>]))</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>

<figure class="highlight typescript"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment">// 类泛型</span></span><br><span class="line"><span class="keyword">namespace</span> classGeneric &#123;</span><br><span class="line">    <span class="class"><span class="keyword">class</span> <span class="title">DataManager</span>&lt;<span class="title">T</span>&gt;</span>&#123;</span><br><span class="line">        <span class="function"><span class="title">constructor</span>(<span class="params"><span class="keyword">private</span> data: T[]</span>)</span> &#123; &#125;</span><br><span class="line">        <span class="function"><span class="title">getItem</span>(<span class="params">index: <span class="built_in">number</span></span>)</span> &#123;</span><br><span class="line">            <span class="keyword">return</span> <span class="built_in">this</span>.data[index]</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">const</span> data = <span class="keyword">new</span> DataManager([<span class="string">&#x27;1&#x27;</span>, <span class="string">&#x27;2&#x27;</span>, <span class="string">&#x27;3&#x27;</span>])<span class="comment">//类自动进行了推断</span></span><br><span class="line">    <span class="built_in">console</span>.log(data.getItem(<span class="number">1</span>))</span><br><span class="line">    <span class="keyword">const</span> numbers = <span class="keyword">new</span> DataManager&lt;<span class="built_in">number</span>&gt;([<span class="number">1</span>, <span class="number">2</span>, <span class="number">3</span>])</span><br><span class="line">    <span class="built_in">console</span>.log(numbers)</span><br><span class="line"></span><br><span class="line">    <span class="comment">//让泛型继承接口，会限制格式</span></span><br><span class="line">    <span class="keyword">interface</span> Obj &#123;</span><br><span class="line">        <span class="attr">name</span>: <span class="built_in">string</span></span><br><span class="line">    &#125;</span><br><span class="line">    <span class="class"><span class="keyword">class</span> <span class="title">DataManager1</span>&lt;<span class="title">T</span> <span class="keyword">extends</span> <span class="title">Obj</span>&gt;</span>&#123;</span><br><span class="line">        <span class="function"><span class="title">constructor</span>(<span class="params"><span class="keyword">private</span> data: T[]</span>)</span> &#123; &#125;</span><br><span class="line">        <span class="function"><span class="title">getItem</span>(<span class="params">index: <span class="built_in">number</span></span>)</span> &#123;</span><br><span class="line">            <span class="keyword">return</span> <span class="built_in">this</span>.data[index].name</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">const</span> data1 = <span class="keyword">new</span> DataManager1&lt;Obj&gt;([&#123; <span class="attr">name</span>: <span class="string">&#x27;dell&#x27;</span> &#125;])</span><br><span class="line">    <span class="built_in">console</span>.log(data.getItem(<span class="number">0</span>))</span><br><span class="line"></span><br><span class="line">    <span class="class"><span class="keyword">class</span> <span class="title">DataManager2</span>&lt;<span class="title">T</span> <span class="keyword">extends</span> <span class="title">number</span> | <span class="title">string</span>&gt;</span>&#123;<span class="comment">//让T只能是某些类型</span></span><br><span class="line">        <span class="function"><span class="title">constructor</span>(<span class="params"><span class="keyword">private</span> data: T[]</span>)</span> &#123; &#125;</span><br><span class="line">        getItem(index: <span class="built_in">number</span>): T &#123;</span><br><span class="line">            <span class="keyword">return</span> <span class="built_in">this</span>.data[index]</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">interface</span> Test &#123;</span><br><span class="line">        <span class="attr">name</span>: <span class="built_in">string</span></span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">const</span> data2 = <span class="keyword">new</span> DataManager2&lt;<span class="built_in">string</span>&gt;([<span class="string">&#x27;&#x27;</span>])</span><br><span class="line"></span><br><span class="line">    <span class="comment">//泛型和函数</span></span><br><span class="line">    <span class="keyword">const</span> fun: &lt;T&gt;<span class="function">(<span class="params">a: T</span>) =&gt;</span> <span class="built_in">string</span></span><br><span class="line">        = &lt;T&gt;<span class="function">(<span class="params">a: T</span>) =&gt;</span> <span class="string">&#x27;123&#x27;</span></span><br><span class="line">    <span class="built_in">console</span>.log(fun&lt;<span class="built_in">number</span>&gt;(<span class="number">0</span>))</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>

<h2 id="第五章"><a href="#第五章" class="headerlink" title="第五章"></a>第五章</h2><blockquote>
<p>命名空间</p>
</blockquote>
<figure class="highlight typescript"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment">// 命名空间上</span></span><br><span class="line"><span class="keyword">namespace</span> nameSpaces&#123;</span><br><span class="line">    <span class="keyword">interface</span> Person &#123;</span><br><span class="line">        <span class="attr">name</span>: <span class="built_in">string</span>;</span><br><span class="line">        age: <span class="built_in">number</span>;</span><br><span class="line">        gender?: <span class="built_in">string</span>;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="class"><span class="keyword">class</span> <span class="title">Teacher</span> </span>&#123;</span><br><span class="line">        <span class="function"><span class="title">constructor</span>(<span class="params"><span class="keyword">private</span> info: Person</span>)</span> &#123; &#125;</span><br><span class="line">        getInfo&lt;T <span class="keyword">extends</span> keyof Person&gt;(key: T) &#123;</span><br><span class="line">            <span class="comment">//type T=&#x27;name&#x27;|&#x27;age&#x27;|&#x27;gender&#x27;</span></span><br><span class="line">            <span class="comment">//keyof 通过遍历Person上的属性保证了T类型属于Person的属性的类型</span></span><br><span class="line">            <span class="keyword">return</span> <span class="built_in">this</span>.info[key]</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">const</span> teacher = <span class="keyword">new</span> Teacher(&#123;</span><br><span class="line">        <span class="attr">name</span>: <span class="string">&#x27;teacher&#x27;</span>,</span><br><span class="line">        <span class="attr">age</span>: <span class="number">30</span>,</span><br><span class="line">        <span class="attr">gender</span>: <span class="string">&#x27;male&#x27;</span></span><br><span class="line">    &#125;)</span><br><span class="line">    <span class="keyword">const</span> name = teacher.getInfo(<span class="string">&#x27;name&#x27;</span>)</span><br><span class="line">    <span class="keyword">const</span> age = teacher.getInfo(<span class="string">&#x27;age&#x27;</span>)</span><br><span class="line">    <span class="keyword">const</span> gender = teacher.getInfo(<span class="string">&#x27;gender&#x27;</span>)</span><br><span class="line">    <span class="built_in">console</span>.log(name,age,gender)</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>

    });
  }
